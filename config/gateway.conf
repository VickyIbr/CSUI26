server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Dashboard (Frontend) under /studio
    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing Page (Astro submodule)
    # Once the Astro landing service is enabled in compose.yml, replace this block with:
    # location / {
    #     proxy_pass http://landing:80;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    location / {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>CSUI Zenith</title></head><body><h1>CSUI Zenith</h1><p>Landing page (Astro submodule) is not attached yet. Go to <a href="/studio/">/studio/</a> for the dashboard.</p></body></html>';
    }
}
